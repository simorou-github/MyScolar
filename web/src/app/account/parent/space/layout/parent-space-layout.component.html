<div class="psl-wrapper">
  <header class="psl-header">
    <a routerLink="/parent/space/dashboard" class="psl-brand">
      <div class="psl-brand-mark">
        <span>s</span>
        <i></i>
      </div>
      <div class="psl-brand-text">
        <span>Scolar<strong>Plus</strong></span>
        <small>Espace Parent</small>
      </div>
    </a>

    <div class="psl-user">
      <div class="psl-user-avatar">{{ (firstName?.[0] ?? 'P') | uppercase }}{{ (lastName?.[0] ?? '') | uppercase }}</div>
      <div class="psl-user-info">
        <strong>{{ firstName }} {{ lastName }}</strong>
        <span>Parent</span>
      </div>
      <button class="psl-logout-btn" (click)="logout()" title="Déconnexion">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </header>

  <main class="psl-content">
    <router-outlet></router-outlet>
  </main>
</div>
