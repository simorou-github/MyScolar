<div class="rp-wrapper">
    <div class="rp-card">

        <a routerLink="/" class="rp-logo">
            <div class="rp-logo-mark">
                <span class="rp-lm-s">s</span>
                <span class="rp-lm-dot"></span>
            </div>
            <span class="logo-text">Scolar<strong><b style="color: #F47920;">P</b>lus</strong></span>
        </a>

        <div class="rp-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>

        <div class="rp-header">
            <h3>Mot de passe oublié ?</h3>
            <p>Entrez votre adresse e-mail et nous vous envoyons un lien pour réinitialiser votre mot de passe.</p>
        </div>

        <form class="rp-form" [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()" novalidate>

            <div class="rp-field">
                <label for="email" class="rp-label">Adresse email</label>
                <div class="rp-input-wrap">
                    <svg class="rp-input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                    <input type="email" formControlName="email" id="email" class="form-control rp-input"
                        placeholder="votre@email.com"
                        [ngClass]="{ 'is-invalid': resetPasswordForm.get('email')?.touched && resetPasswordForm.get('email')?.invalid }">
                </div>
                <div class="rp-error" *ngIf="resetPasswordForm.get('email')?.touched && resetPasswordForm.get('email')?.errors">
                    <span *ngIf="resetPasswordForm.get('email')?.errors?.required">Entrez votre adresse mail.</span>
                    <span *ngIf="resetPasswordForm.get('email')?.errors?.pattern">Format d'email invalide.</span>
                </div>
            </div>

            <button class="btn rp-btn-submit" [disabled]="!resetPasswordForm.valid || isProcessing" type="submit">
                <span *ngIf="!isProcessing" class="rp-btn-content">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                    Envoyer le lien de réinitialisation
                </span>
                <span *ngIf="isProcessing" class="rp-btn-content">
                    <span class="rp-spinner"></span>
                    Envoi en cours…
                </span>
            </button>

        </form>

        <a routerLink="/" class="rp-back">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Retour à la connexion
        </a>

        <div class="rp-footer">
            <p>© {{ year }} <strong>Scolar Plus</strong></p>
        </div>

    </div>
</div>
