<header id="page-topbar">
  <div class="navbar-header">

    <!-- ── Left : logo + menu toggle ─────────────────── -->
    <div class="d-flex align-items-center">

      <!-- Logo -->
      <div class="navbar-brand-box">
        <a routerLink="/dashboard" class="logo logo-dark">
          <!-- <span class="logo-sm">
            <div class="sp-logo-sm">
              <span class="sp-lm-s">S</span>
              <span class="sp-lm-dot"></span>
            </div>
          </span> -->
          <span class="logo-lg">
            <div class="sp-logo-full">
              <div class="sp-logo-mark">
                <span class="sp-lm-s">S</span>
                <span class="sp-lm-dot"></span>
              </div>
              <div class="sp-logo-text" *ngIf="!isToogle">
                <span style="color: black !important; font-size: large !important;">Scolar<strong style="color: orange !important;">P</strong>lus</span>
                <!-- <small>Gestion Scolaire</small> -->
              </div>
            </div>
          </span>
        </a>

        <!-- logo-light mirrors logo-dark (shown when sidebar=dark) -->
        <a routerLink="/dashboard" class="logo logo-light">
          <!-- <span class="logo-sm">
            <div class="sp-logo-sm">
              <span class="sp-lm-s">S</span>
              <span class="sp-lm-dot"></span>
            </div>
          </span> -->
          <span class="logo-lg">
            <div class="sp-logo-full">
              <div class="sp-logo-mark">
                <span class="sp-lm-s">S</span>
                <span class="sp-lm-dot"></span>
              </div>
              <div class="sp-logo-text" *ngIf="!isToogle">
                <span style="color: black !important; font-size: large !important;">Scolar<strong style="color: orange !important;">P</strong>lus</span>
                <!-- <small>Gestion Scolaire</small> -->
              </div>
            </div>
          </span>
        </a>
      </div>

      <!-- Sidebar toggle -->
      <button type="button"
              class="btn tp-toggle-btn"
              id="vertical-menu-btn"
              (click)="toggleMobileMenu($event)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6"  x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- ── Right : notifications + user ──────────────── -->
    <div class="d-flex align-items-center gap-1">

      <!-- Bell (only when pending inscriptions) -->
      <div class="dropdown" dropdown *ngIf="inscriptions > 0">
        <button type="button"
                class="btn tp-icon-btn"
                id="page-header-notifications-dropdown"
                dropdownToggle>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.8">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span class="tp-badge">{{ inscriptions }}</span>
        </button>

        <div class="dropdown-menu dropdown-menu-lg dropdown-menu-end tp-notif-drop"
             *dropdownMenu>
          <div class="tp-notif-head">
            <span>Notifications</span>
            <a href="javascript:void(0);" class="tp-notif-see-all">Voir tout</a>
          </div>
          <ngx-simplebar style="height: 220px;">
            <a href="javascript:void(0);" class="tp-notif-item">
              <div class="tp-notif-icon tp-notif-icon--blue">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2">
                  <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                  <circle cx="8.5" cy="7" r="4"/>
                  <line x1="20" y1="8" x2="20" y2="14"/>
                  <line x1="23" y1="11" x2="17" y2="11"/>
                </svg>
              </div>
              <div class="tp-notif-body">
                <p class="tp-notif-title">Inscriptions en attente</p>
                <p class="tp-notif-text">
                  {{ inscriptions }} nouvelle(s) inscription(s) à valider.
                </p>
              </div>
            </a>
          </ngx-simplebar>
        </div>
      </div>

      <!-- User profile -->
      <div class="dropdown" dropdown>
        <button type="button"
                class="btn tp-user-btn"
                dropdownToggle
                id="page-header-user-dropdown">
          <img class="tp-avatar"
               src="assets/images/users/user-dummy-img.jpg"
               alt="Avatar">
          <span class="tp-username d-none d-xl-inline-block">{{ username }}</span>
          <svg class="d-none d-xl-inline-block tp-chevron"
               width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>

        <div class="dropdown-menu dropdown-menu-end tp-user-drop" *dropdownMenu>
          <div class="tp-user-drop-header">
            <img class="tp-drop-avatar"
                 src="assets/images/users/user-dummy-img.jpg"
                 alt="Avatar">
            <div>
              <p class="tp-drop-name">{{ username }}</p>
              <p class="tp-drop-role">Administrateur</p>
            </div>
          </div>
          <div class="dropdown-divider m-0"></div>
          <a class="dropdown-item tp-drop-item" routerLink="/scolar/profile">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            Mon profil
          </a>
          <div class="dropdown-divider m-0"></div>
          <a class="dropdown-item tp-drop-item tp-drop-item--danger"
             href="javascript:void(0);"
             (click)="logout()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Se déconnecter
          </a>
        </div>
      </div>

    </div>
  </div>
</header>
