      <div class="dropdown d-inline-block" dropdown *ngIf="inscriptions > 0">
        <button type="button" class="btn header-item noti-icon" id="page-header-notifications-dropdown"
          dropdownToggle>
          <i class="bx bx-bell bx-tada"></i>
          <span class="badge bg-danger rounded-pill">{{inscriptions}}</span>
        </button>
        <div class="dropdown-menu dropdown-menu-lg dropdown-menu-end p-0"
          aria-labelledby="page-header-notifications-dropdown" *dropdownMenu>
          <div class="p-3">
            <div class="row align-items-center">
              <div class="col">
                <h6 class="m-0">Notifications</h6>
              </div>
              <div class="col-auto">
                <a href="javascript: void(0);" class="small">Voir Tous</a>
              </div>
            </div>
          </div>
          <ngx-simplebar style="position: relative; height: 230px;">
            <a href="javascript: void(0);" class="text-reset notification-item">
              <div class="d-flex">
                <div class="avatar-xs me-3">
                  <span class="avatar-title bg-primary rounded-circle font-size-16">
                    <i class="bx bx-user-plus"></i>
                  </span>
                </div>
                <div class="flex-grow-1">
                  <h6 class="mb-1">Inscriptions en attentes</h6>
                  <div class="font-size-13 text-muted">
                    <p class="mb-1">{{ inscriptions }} nouvelle(s) inscription(s) en attente de validation.</p>
                    <p class="mb-0"><i class="mdi mdi-clock-outline"></i> </p>
                  </div>
                </div>
              </div>
            </a>
          </ngx-simplebar>
        </div>
