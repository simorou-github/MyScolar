<div class="container-fluid">
  <app-page-title title="Statistiques | {{ schoolName }}"></app-page-title>

  <ngx-ui-loader overlayColor="rgba(40, 40, 40, 0.8)" blur="0" [bgsOpacity]="3" [fgsType]="'rectangle-bounce'"
    [loaderId]="'loader-spin'" [fgsPosition]="'top-center'"></ngx-ui-loader>

  <div class="row">
    <!-- Graphique camembert -->
    <div class="col-lg-6">
      <div class="card">
        <div class="card-body">
          <h4 class="card-title">Graphique des Paiements reçus</h4>
          <apx-chart class="apex-charts" dir="ltr"
            [series]="simplePieChart?.series"
            [chart]="simplePieChart?.chart"
            [labels]="simplePieChart?.labels"
            [legend]="simplePieChart?.legend"
            [colors]="simplePieChart?.colors"
            [responsive]="simplePieChart?.responsive">
          </apx-chart>
        </div>
      </div>
    </div>

    <!-- Tableau des paiements -->
    <div class="col-lg-6">
      <div class="iv-card">
        <div class="iv-card-header">
          <div class="iv-card-header-left">
            <div class="iv-card-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/>
                <line x1="6" y1="20" x2="6" y2="16"/>
              </svg>
            </div>
            <div>
              <h2 class="iv-card-title">Total des Paiements Reçus</h2>
              <p class="iv-card-sub">
                <b class="text-primary">{{totalOfPaymentAggregationByTypeFeesData | currency:'XOF'}}</b>
              </p>
            </div>
          </div>
        </div>

        <div class="iv-table-wrap">
          <table class="iv-table">
            <thead>
              <tr>
                <th class="iv-th-num">#</th>
                <th>Type de Frais Reçu</th>
                <th>Montant</th>
              </tr>
            </thead>
            <tbody>
              <ng-container *ngIf="isProcessing">
                <tr class="iv-skeleton-row" *ngFor="let i of [1,2,3,4,5]">
                  <td class="iv-td-num"><div class="sk sk--xs sk--center"></div></td>
                  <td><div class="sk sk--lg"></div></td>
                  <td><div class="sk sk--md"></div></td>
                </tr>
              </ng-container>
              <tr *ngIf="!isProcessing && paymentAggregationByTypeFeesData?.length == 0">
                <td colspan="3" class="iv-td-empty">
                  <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#CBD5E1" stroke-width="1.5">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M8 15s1.5-2 4-2 4 2 4 2"/>
                    <line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/>
                  </svg>
                  <span>Aucune donnée trouvée</span>
                </td>
              </tr>
              <ng-container *ngIf="!isProcessing">
                <tr *ngFor="let aggregat of paymentAggregationByTypeFeesData | paginate: {id:'table1', itemsPerPage: 5, currentPage: p1 }; let i = index;">
                  <td class="iv-td-num">{{i+1}}</td>
                  <td class="iv-school-name">{{aggregat.type_fees?.label}}</td>
                  <td class="iv-td-amount">{{aggregat.sum | currency:'XOF'}}</td>
                </tr>
              </ng-container>
            </tbody>
          </table>
        </div>

        <div class="text-end">
          <pagination-controls id="table1" previousLabel="←" nextLabel="→" (pageChange)="p1 = $event"></pagination-controls>
        </div>
      </div>
    </div>
  </div>
</div>
